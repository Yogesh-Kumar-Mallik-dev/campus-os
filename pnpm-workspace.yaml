packages:
  - 'db-layer'
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@bufbuild/buf': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true

onlyBuiltDependencies:
  - '@bufbuild/buf'
  - '@prisma/client'
  - '@prisma/engines'
  - 'esbuild'
  - 'prisma'
  - 'protobufjs'
