syntax = "proto3";

package campus.v1;

option go_package = "github.com/Yogesh-Kumar-Mallik-dev/campus-os/backend/pkg/proto/campus/v1;campusv1";

// Request metadata containing transaction lease token and correlation context
message RequestMeta {
  string request_id = 1;
  string actor_id = 2;
  string tx_token = 3;
}

// Transaction session initiation
message BeginTxRequest {
  string request_id = 1;
  int32 timeout_seconds = 2;
}

message BeginTxResponse {
  string tx_token = 1;
  int64 expires_at_unix = 2;
}

message CommitTxRequest {
  string tx_token = 1;
}

message CommitTxResponse {
  bool success = 1;
}

message RollbackTxRequest {
  string tx_token = 1;
}

message RollbackTxResponse {
  bool success = 1;
}

// Canonical Database Persistence Service (TypeScript DB Layer over UDS)
service DatabaseService {
  rpc BeginTx(BeginTxRequest) returns (BeginTxResponse);
  rpc CommitTx(CommitTxRequest) returns (CommitTxResponse);
  rpc RollbackTx(RollbackTxRequest) returns (RollbackTxResponse);
}
