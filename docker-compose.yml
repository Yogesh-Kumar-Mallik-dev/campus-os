services:
  campus-db:
    image: postgres:16-alpine
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_os
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_password_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_admin -d campus_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  campus-db-layer:
    build:
      context: .
      dockerfile: ./db-layer/Dockerfile
    container_name: campus-db-layer
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://campus_admin:campus_password_dev@campus-db:5432/campus_os?schema=auth_schema"
      SOCKET_PATH: "/var/run/campus-os/db.sock"
    volumes:
      - campus-sock:/var/run/campus-os
    depends_on:
      campus-db:
        condition: service_healthy
    networks:
      - campus-net

  campus-backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: campus-backend
    restart: unless-stopped
    environment:
      DB_SOCKET_PATH: "/var/run/campus-os/db.sock"
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - campus-sock:/var/run/campus-os
    depends_on:
      - campus-db-layer
    networks:
      - campus-net

volumes:
  pgdata:
  campus-sock:

networks:
  campus-net:
    driver: bridge
